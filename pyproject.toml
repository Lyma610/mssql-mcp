[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[project]
name = "mssql-mcp"
version = "2.0.0"
description = "Read-first Model Context Protocol server for Microsoft SQL Server discovery, analysis, and controlled changes."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "mssql-mcp contributors" }]
keywords = ["mcp", "sql-server", "mssql", "database", "model-context-protocol"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
]
dependencies = [
  "mcp>=1.27,<2",
  "pyodbc>=5.2,<6",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "pip-audit>=2.9,<3",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
mssql-mcp = "mssql_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mssql_mcp"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires a reachable SQL Server configured through environment variables",
]

[tool.coverage.run]
branch = true
source = ["mssql_mcp"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
